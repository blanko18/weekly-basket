<style>
/* Layout: one-column phone-first app, sticky top bar, fixed bottom add bar; reports render as a till receipt */
:root{
  --bg:#EEF3EE; --surface:#FFFFFF; --ink:#16231B; --muted:#5B6D61; --line:#D8E2DA;
  --accent:#1E7A4B; --accent-ink:#FFFFFF; --accent-soft:#DDEEE3; --warn:#B0521E; --warn-soft:#F8E6DA;
  --done:#93A398; --receipt:#FFFFFF; --shadow:0 1px 2px rgba(22,35,27,.06),0 8px 24px rgba(22,35,27,.06);
  --display:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#17211B; --ink:#E4EDE6; --muted:#93A699; --line:#28362D;
  --accent:#4FC387; --accent-ink:#06200F; --accent-soft:#1B3325; --warn:#EE9963; --warn-soft:#3A2618;
  --done:#5C6D62; --receipt:#1B261F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#17211B; --ink:#E4EDE6; --muted:#93A699; --line:#28362D;
  --accent:#4FC387; --accent-ink:#06200F; --accent-soft:#1B3325; --warn:#EE9963; --warn-soft:#3A2618;
  --done:#5C6D62; --receipt:#1B261F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 160px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
.top .ttl{flex:1;min-width:0}
.top h1{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:.85rem;color:var(--muted)}
.brand{font-family:var(--display);font-weight:800;font-size:1.75rem;letter-spacing:-.02em;flex:1}
.brand span{color:var(--accent)}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.icon:hover{background:var(--accent-soft)}
.icon svg{width:22px;height:22px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 16px;font-weight:600;border:1px solid var(--line);background:var(--surface);min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn-soft);background:transparent}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

h2.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:24px 0 10px}
.stack{display:grid;gap:10px}
.card{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:10px;text-align:left;width:100%}
.card .row{display:flex;align-items:center;gap:12px}
.card .name{font-weight:700;font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{font-size:.85rem;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted);font-size:.95rem;text-align:center}
.banner{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;margin-top:4px}
.banner b{font-weight:700}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.prog{display:grid;gap:8px;padding-block:4px 6px}
.prog .nums{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.prog .nums b{color:var(--ink)}
.over{color:var(--warn)!important}

.group{margin-top:18px}
.group h3{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:700;display:flex;justify-content:space-between}
.items{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:4px;min-height:56px;padding-right:6px}
.item+.item{border-top:1px solid var(--line)}
.check{width:52px;height:56px;display:grid;place-items:center;flex:none}
.check span{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.check svg{width:16px;height:16px;opacity:0;color:var(--accent-ink);transition:opacity .15s}
.item.done .check span{background:var(--accent);border-color:var(--accent)}
.item.done .check svg{opacity:1}
.itext{flex:1;min-width:0;text-align:left;padding-block:8px;display:flex;flex-direction:column}
.iname{font-weight:600;overflow-wrap:anywhere}
.iqty{font-size:.85rem;color:var(--muted)}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);margin-left:6px}
.item.done .iname{color:var(--done);text-decoration:line-through;text-decoration-thickness:1.5px}
.iprice{font-family:var(--mono);font-size:.9rem;padding:8px 10px;border-radius:10px;color:var(--ink);font-variant-numeric:tabular-nums;flex:none}
.iprice.none{color:var(--muted);font-family:var(--body);font-size:.85rem}
.iprice:hover{background:var(--accent-soft)}
.pad{padding-left:16px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.addrow{display:flex;gap:8px;min-width:0}
.addrow input{width:0}
.addrow .btn.primary{flex:none;padding-inline:14px}
.addrow input{flex:1;min-width:0;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.addrow input:focus{border-color:var(--accent);outline:none}
.addrow .btn{height:48px}
.hint{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.hint label{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500}
.hint input{width:18px;height:18px;accent-color:var(--accent)}

.allset{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-top:16px}
.allset div{flex:1;font-weight:600}
.allset .btn{background:var(--accent-ink);color:var(--accent);border:0}

.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,18,13,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .2s ease}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0 0 12px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label,.flabel{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;width:100%}
.field textarea{height:140px;padding:10px 12px;font-family:var(--mono);font-size:.85rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg label{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;cursor:pointer}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg b{font-weight:700}
.seg small{color:var(--muted);font-size:.8rem}
.actions{display:grid;gap:8px;margin-top:8px}
.sep{height:1px;background:var(--line);margin:14px 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-size:.95rem;animation:up .2s ease}
.toast button{color:var(--accent);font-weight:700;padding:6px 10px;border-radius:8px;filter:brightness(1.25)}

.receipt{background:var(--receipt);font-family:var(--mono);font-size:.88rem;padding:22px 18px 26px;margin-top:8px;box-shadow:var(--shadow);position:relative;font-variant-numeric:tabular-nums;
  --tooth:8px;-webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--tooth)) no-repeat, conic-gradient(from 135deg at 50% 0, #000 90deg,#0000 0) bottom/calc(var(--tooth)*2) var(--tooth) repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--tooth)) no-repeat, conic-gradient(from 135deg at 50% 0, #000 90deg,#0000 0) bottom/calc(var(--tooth)*2) var(--tooth) repeat-x}
.receipt .c{text-align:center}
.receipt .store{font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.receipt .rule{border-top:1.5px dashed var(--line);margin:12px 0}
.receipt .ln{display:flex;gap:6px;align-items:baseline}
.receipt .ln .n{min-width:0;overflow-wrap:anywhere}
.receipt .ln .d{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px);min-width:12px}
.receipt .ln .q{color:var(--muted)}
.receipt .h{font-weight:500;margin-bottom:6px;letter-spacing:.08em}
.receipt .tot{font-size:1.15rem;font-weight:500}
.receipt .miss{color:var(--warn)}
.receipt .muted{color:var(--muted)}
.addrow .btn.icon2{width:48px;padding:0;flex:none}
.addrow .btn.icon2 svg{width:22px;height:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px;max-height:180px;overflow:auto}
.chip{font-size:.85rem;padding:5px 10px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}
.chip small{color:var(--muted);margin-left:4px}
.chip.dup{background:transparent;border:1px dashed var(--line);color:var(--muted);text-decoration:line-through}
.btn svg{width:18px;height:18px;flex:none}
.top .btn{white-space:nowrap;flex:none}
.brand{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.brand{font-size:1.3rem}.top .icon{width:36px}}
@media (max-width:420px){.top .lbl{display:none}.top .btn.primary.sm{font-size:1.2rem;padding-inline:13px}}
.tools{display:flex;gap:8px;margin-top:10px}
.tools .btn{flex:1;background:transparent;gap:8px}
.tools svg{width:18px;height:18px}
.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:359px){.addrow .btn.icon2{width:42px}.addrow .btn.primary{padding-inline:12px}.addrow{gap:6px}}
.srow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.srow.off .srow-main{opacity:.45}
.srow-on{padding-top:12px}.srow-on input{width:20px;height:20px;accent-color:var(--accent)}
.srow-main{flex:1;min-width:0;display:grid;gap:6px}
.srow input.srow-name,.srow select,.srow input.srow-price{height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;font-size:15px;width:100%;min-width:0}
.srow-sub{display:grid;grid-template-columns:1fr 92px;gap:6px}
.srow input.srow-price{font-family:var(--mono);text-align:right}
#bulkMic.live{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
#bulkMic.live svg{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.pick{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.pick span{flex:1;min-width:0;font-weight:600}
.pick small{color:var(--muted);font-weight:400}
.sync{text-align:center;font-size:.8rem;color:var(--muted);margin-top:28px}
.hist{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left}
.hist+.hist{border-top:1px solid var(--line)}
.hist .name{flex:1;min-width:0;font-weight:600}
.hist .amt{font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums}

@keyframes up{from{transform:translateY(16px);opacity:0}}
.toast{animation-name:up2}
@keyframes up2{from{transform:translate(-50%,16px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
const CATS=['Produce','Meat & fish','Bakery','Dairy & eggs','Pantry','Frozen','Drinks','Household','Other'];
const KW={
  'Produce':['eggplant','apple','banana','onion','garlic','tomato','potato','carrot','lettuce','cabbage','kangkong','pechay','calamansi','lemon','lime','ginger','mango','fruit','vegetable','veg','sitaw','ampalaya','squash','kalabasa','malunggay','cucumber','pepper','chili','sili','avocado','papaya','pineapple','orange','grapes','spinach','herb'],
  'Meat & fish':['chicken','pork','beef','fish','tilapia','bangus','galunggong','shrimp','hipon','squid','pusit','liempo','ground','tuna','salmon','meat','bacon','longganisa','tocino','ham','crab'],
  'Dairy & eggs':['milk','cheese','butter','egg','yogurt','yoghurt','cream','margarine'],
  'Bakery':['bread','pandesal','loaf','bun','tasty','ensaymada','cheesecake','cake','piyaya','hopia','tortilla','croissant'],
  'Pantry':['rice','oil','sugar','salt','soy','vinegar','pasta','spaghetti','noodle','pancit','sardine','coffee','flour','sauce','ketchup','canned','corned','oat','cereal','tea','patis','bagoong','mayo','peanut','jam','honey','spice','cornstarch','beans','biscuit','chips','snack','suka','tabasco','lucky me','macaroni','wafer','cookie','crackers','luncheon'],
  'Frozen':['frozen','ice','hotdog','nugget','siomai','dumpling'],
  'Drinks':['water','juice','soda','coke','beer','wine','softdrink','milo'],
  'Household':['soap','detergent','tissue','toilet','shampoo','conditioner','toothpaste','toothbrush','dish','bleach','trash','garbage','sponge','foil','wrap','battery','batteries','fabric','downy','alcohol','diaper','wipes','napkin','likas','belo','dove','lotion','deodorant']
};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const RX={};for(const c in KW)RX[c]=new RegExp('\\b('+KW[c].join('|')+')','i');
function guessCat(n){for(const c of CATS){if(RX[c]&&RX[c].test(n))return c}return 'Other'}

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2});
const money2=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const dShort=t=>new Date(t).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'});
const dLong=t=>new Date(t).toLocaleString('en-PH',{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const num=v=>{const x=parseFloat(String(v).replace(/[^\d.]/g,''));return isFinite(x)&&x>0?x:null};
const ICON={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  lines:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="3.5" cy="6" r="1" fill="currentColor"/><circle cx="3.5" cy="12" r="1" fill="currentColor"/><circle cx="3.5" cy="18" r="1" fill="currentColor"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>',
  receipt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- state ---------- */
const LS='weekly-basket-v1';
let dl=null, state=null, view={s:'home'}, ref=null, cloud=false, saveTimer=null, saving=Promise.resolve(), addToTpl=false;

/* ---------- platform: Android app (Capacitor) or web ---------- */
const CAP=window.Capacitor;const NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
function NP(n){try{const g=window['capacitor'+n];return (g&&g[n])||(CAP&&CAP.Plugins&&CAP.Plugins[n])||(CAP&&CAP.registerPlugin?CAP.registerPlugin(n):null)}catch(e){return null}}
const canSendFiles=()=>NATIVE||!!dl;
function toB64(data){return new Promise((res,rej)=>{const b=data instanceof Blob?data:new Blob([data],{type:'text/plain'});const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)})}
const isCancel=e=>/cancel|abort/i.test(String((e&&(e.message||e.name||e.code))||e||''))||(e&&e.code==='declined');
async function sendFile(filename,data,title){
  if(NATIVE){const FS=NP('Filesystem'),SH=NP('Share');const safe=filename.replace(/[\\/:*?"<>|]+/g,'-');
    const r=await FS.writeFile({path:safe,data:await toB64(data),directory:'CACHE'});
    await SH.share({title:title||safe,files:[r.uri],dialogTitle:title||'Share'});return}
  if(dl){await dl.save({filename,data});return}
  throw {code:'unavailable'};
}
async function sendText(text,title){
  if(NATIVE){await NP('Share').share({title,text,dialogTitle:title});return 'shared'}

function applyScan(){
  const st=scanState;if(!st)return;const t=st.target;const bought=st.bought;
  /* merge repeated receipt lines (e.g. the same item scanned twice) */
  const fresh=[];const byName={};
  for(const r of st.rows){if(!r.on||r.match!=='new')continue;const name=(r.name||'').trim();if(!name)continue;const k=name.toLowerCase();
    if(byName[k]){const f=byName[k];f.count++;f.price=(f.price||0)+(r.price||0)||null;f.qty=f.count+'x';continue}
    byName[k]={name,price:r.price||null,qty:r.qty||'',cat:r.cat||null,count:1};fresh.push(byName[k])}
  const remember=(n,p)=>{if(p)state.prices[n.toLowerCase()]=p};
  const tobj=targetObj(t);
  for(const r of st.rows){if(!r.on||!r.raw)continue;
    const fin=r.match!=='new'&&tobj?(tobj.items.find(i=>i.id===r.match)||{}).name:(r.name||'').trim();
    if(fin)learn(r.raw,fin,r.price,r.cat,r.qty,r.match==='new'?r.invId:null)}
  let m=0,a=0,dest=null;
  if(t.kind==='newList'||t.kind==='list'){
    let l=t.kind==='list'?L(t.id):null;
    if(!l){l={id:uid(),name:(st.name||'Receipt').trim()||'Receipt',createdAt:Date.now(),status:'active',items:[]};state.lists.unshift(l)}
    for(const r of st.rows){if(!r.on||r.match==='new')continue;const it=l.items.find(i=>i.id===r.match);if(!it)continue;
      if(bought){if(r.price)it.price=r.price;it.done=true}remember(it.name,r.price);m++}
    for(const f of fresh){const ex=l.items.find(i=>i.name.toLowerCase()===f.name.toLowerCase());
      if(ex){if(f.price)ex.price=f.price;if(bought)ex.done=true;m++;continue}
      l.items.push({...item(f.name,f.qty),...(f.cat?{cat:f.cat}:{}),done:bought,price:bought?f.price:null});remember(f.name,f.count>1?null:f.price);a++}
    dest={s:'list',id:l.id};
  }else{
    let tp=t.kind==='tpl'?T(t.id):null;
    if(!tp){tp={id:uid(),name:(st.name||'Receipt').trim()||'Receipt',autoDay:null,budget:null,carry:[],items:[]};state.templates.push(tp)}
    for(const r of st.rows){if(!r.on||r.match==='new')continue;const it=tp.items.find(i=>i.id===r.match);if(it){remember(it.name,r.price);m++}}
    for(const f of fresh){if(tp.items.some(i=>i.name.toLowerCase()===f.name.toLowerCase())){m++;continue}
      tp.items.push({...item(f.name,f.qty),...(f.cat?{cat:f.cat}:{})});remember(f.name,f.count>1?null:f.price);a++}
    dest={s:'tpl',id:tp.id};
  }
  scanState=null;closeSheet();view=dest;commit();scrollTo(0,0);
  toast(a&&!m?`Added ${a} item${a===1?'':'s'} from the receipt`:`Updated ${m} item${m===1?'':'s'}${a?`, added ${a}`:''} from the receipt`);
}

function runAuto(){
  let changed=false;const now=new Date();
  for(const t of state.templates){
    if(t.autoDay==null)continue;
    const back=(now.getDay()-t.autoDay+7)%7;
    const occ=new Date(now.getFullYear(),now.getMonth(),now.getDate()-back).getTime();
    const active=state.lists.some(l=>l.templateId===t.id&&l.status==='active');
    if(!active&&(t.lastStarted||0)<occ&&!state.example){state.lists.unshift(fromTemplate(t));changed=true}
  }
  if(changed)commit();
}

async function reportPng(l){

  add({k:'c',t:'W E E K L Y   B A S K E T',w:500});add({k:'c',t:l.name});add({k:'c',t:dLong(l.finishedAt||Date.now()),col:C.muted});
  if(live)add({k:'c',t:'— SHOPPING IN PROGRESS —',col:C.muted});
  add({k:'rule'});add({k:'l',t:`GOT ${got.length} OF ${l.items.length}`,w:500});
  if(!got.length)add({k:'l',t:'Nothing checked off.',col:C.muted});
  got.forEach(i=>add({k:'row',a:i.name+(i.qty?'  '+i.qty:''),b:i.price?money2(i.price):'—'}));
  add({k:'rule'});add({k:'row',a:'TOTAL',b:money2(t),w:500,sz:18});
  const np=got.filter(i=>!i.price).length;if(np)add({k:'l',t:`${np} item(s) without a price`,col:C.muted,sz:12});
  if(l.budget){const df=l.budget-t;add({k:'row',a:'BUDGET',b:money2(l.budget)});add({k:'row',a:df<0?'OVER':'UNDER',b:money2(Math.abs(df)),col:df<0?C.warn:null})}
  if(miss.length){add({k:'rule'});add({k:'l',t:`${live?'STILL TO GET':'MISSED'} ${miss.length}`,w:500,col:C.warn});miss.forEach(i=>add({k:'l',t:i.name+(i.qty?'  '+i.qty:''),col:C.warn}))}
  add({k:'rule'});add({k:'c',t:live?'Not finished yet':'Thank you, see you next week',col:C.muted});
  // layout pass
  const inner=W-P*2;let y=P+6;const lay=[];
  for(const o of ops){font(o.w||400,o.sz);
    if(o.k==='rule'){lay.push({...o,y:y+8});y+=18;continue}
    if(o.k==='row'){const bw=x.measureText(o.b).width;const ls=wrap(o.a,inner-bw-24);lay.push({...o,ls,bw,y});y+=ls.length*LH+(o.sz?6:0);continue}
    const ls=wrap(o.t,inner);lay.push({...o,ls,y});y+=ls.length*(o.sz===12?18:LH)}
  const H=y+P+10,M=16;cv.width=(W+M*2)*S;cv.height=(H+M*2)*S;x.scale(S,S);
  x.fillStyle=C.bg;x.fillRect(0,0,W+M*2,H+M*2);x.translate(M,M);
  // paper with zigzag bottom
  x.fillStyle=C.paper;x.beginPath();x.moveTo(0,0);x.lineTo(W,0);x.lineTo(W,H-8);for(let px=W;px>8;px-=16){x.lineTo(px-8,H);x.lineTo(Math.max(0,px-16),H-8)}x.lineTo(0,H-8);x.closePath();x.fill();
  x.textBaseline='top';
  for(const o of lay){font(o.w||400,o.sz);x.fillStyle=o.col||C.ink;
    if(o.k==='rule'){x.strokeStyle=C.line;x.lineWidth=1.5;x.setLineDash([6,5]);x.beginPath();x.moveTo(P,o.y);x.lineTo(W-P,o.y);x.stroke();x.setLineDash([]);continue}
    if(o.k==='c'){o.ls.forEach((s2,j)=>{x.textAlign='center';x.fillText(s2,W/2,o.y+j*LH)});x.textAlign='left';continue}
    if(o.k==='l'){o.ls.forEach((s2,j)=>x.fillText(s2,P,o.y+j*(o.sz===12?18:LH)));continue}
    o.ls.forEach((s2,j)=>x.fillText(s2,P,o.y+j*LH));
    const ly=o.y+(o.ls.length-1)*LH,lw=x.measureText(o.ls[o.ls.length-1]).width;
    x.textAlign='right';x.fillText(o.b,W-P,ly);x.textAlign='left';
    x.strokeStyle=C.line;x.lineWidth=1;x.setLineDash([1.5,3]);x.beginPath();const dy=ly+(o.sz||15)*.8;x.moveTo(P+lw+8,dy);x.lineTo(W-P-o.bw-8,dy);x.stroke();x.setLineDash([])}
  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej({code:'bad_request'}),'image/png'));

function addEntries(entries,bulk){

      if(ex){if(ex.done){ex.done=false;back++;msgs.push(`${ex.name} is back on the list`)}else msgs.push(`${ex.name} is already on the list`);continue}
      l.items.push({...item(e.name,e.qty),done:false,price:null});added++;
      if(t&&!t.items.some(i=>i.name.toLowerCase()===e.name.toLowerCase()))t.items.push(item(e.name,e.qty));
    }

      <p style="margin:10px 0 0;color:var(--muted);font-size:.85rem">${canSendFiles()?'The file opens in Weekly Basket with + New → Import shared file. ':''}Text works for anyone, and can be pasted into + New as a list.</p>`)},
  async shareFile(){const p=picked();if(!p)return;closeSheet();
    const payload={app:'weekly-basket',v:1,sharedAt:Date.now(),
      templates:p.t.map(t=>({name:t.name,budget:t.budget||null,items:t.items.map(i=>({name:i.name,qty:i.qty,cat:i.cat}))})),
      lists:p.l.map(l=>({name:l.name,budget:l.budget||null,createdAt:l.createdAt,items:l.items.map(i=>({name:i.name,qty:i.qty,cat:i.cat,done:!!i.done,price:i.price||null}))}))};
    const one=[...p.t,...p.l];const nm=one.length===1?one[0].name:'Weekly Basket';
    try{await sendFile((nm.replace(/[^\w\- ]+/g,'').trim()||'Weekly Basket')+' (shared).json',JSON.stringify(payload,null,1),'Weekly Basket: '+nm);if(!NATIVE)toast('File saved, send it to anyone with the app')}
    catch(e){sendErr(e,'share the file')}},
  async shareText(){const p=picked();if(!p)return;closeSheet();
    const fmt=(name,items,kind)=>[`${name}${kind?' ('+kind+')':''}`,...groupItems(items).flatMap(([c,its])=>its.map(i=>`- ${i.name}${i.qty?' ('+i.qty+')':''}`))].join('\n');
    const txt=[...p.l.map(l=>fmt(l.name,l.items,'')),...p.t.map(t=>fmt(t.name,t.items,'template'))].join('\n\n');
    try{const r=await sendText(txt,'Weekly Basket');if(r==='copied')toast('Copied, paste it anywhere')}catch(e){sendErr(e,'share the text')}},
  importFile(){const f=$('#impFile');if(f)f.click()},
  doImport(){const p=pendingImport;if(!p)return;const sel=[...document.querySelectorAll('#sheet input[data-k]:checked')];
    if(!sel.length){toast('Pick at least one thing to import');return}
    const names=new Set(state.templates.map(t=>t.name.toLowerCase()));let nt=0,nl=0;
    for(const c of sel){const src=p[c.dataset.k==='t'?'templates':'lists'][+c.value];
      const its=(src.items||[]).filter(i=>i&&i.name).map(i=>({id:uid(),name:String(i.name).slice(0,120),qty:String(i.qty||'').slice(0,40),cat:CATS.includes(i.cat)?i.cat:guessCat(String(i.name))}));
      if(c.dataset.k==='t'){let nm=String(src.name||'Shared template').slice(0,80);if(names.has(nm.toLowerCase()))nm+=' (shared)';names.add(nm.toLowerCase());
        state.templates.push({id:uid(),name:nm,autoDay:null,budget:num(src.budget),carry:[],items:its});nt++}
      else{const raw=src.items||[];state.lists.unshift({id:uid(),name:String(src.name||'Shared list').slice(0,80),createdAt:Date.now(),status:'active',budget:num(src.budget),
        items:its.map((i,k)=>({...i,done:!!(raw[k]&&raw[k].done),price:num(raw[k]&&raw[k].price)}))});nl++}}
    pendingImport=null;closeSheet();view={s:'home'};commit();scrollTo(0,0);
    toast(`Imported ${[nt?nt+' template'+(nt>1?'s':''):'',nl?nl+' list'+(nl>1?'s':''):''].filter(Boolean).join(' and ')}`)},
  editItem(d){const {it,l}=findItem(d.id);const isList=!!l;const last=state.prices[it.name.toLowerCase()]||((state.catalog||[]).find(x=>x.name.toLowerCase()===it.name.toLowerCase())||{}).price;
    sheet(`<h3>Edit item</h3><form data-form="item" data-id="${it.id}">
      <div class="field"><label for="fName">Name</label><input id="fName" value="${esc(it.name)}" required></div>
      <div class="two"><div class="field"><label for="fQty">Quantity</label><input id="fQty" value="${esc(it.qty)}" placeholder="e.g. 2 kg"></div>
      ${isList?`<div class="field"><label for="fPrice">Price paid (₱)</label><input id="fPrice" inputmode="decimal" value="${it.price??''}" placeholder="${last?'Last time '+money(last):'0.00'}"></div>`:'<div></div>'}</div>
      <div class="field"><label for="fCat">Aisle</label><select id="fCat">${CATS.map(c=>`<option ${c===it.cat?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="actions"><button class="btn primary block" type="submit">Save</button>
      ${isList?`<button class="btn block" type="button" data-act="priceGot" data-id="${it.id}">${it.done?'Save & keep in basket':'Save & put in basket'}</button>`:''}
      <button class="btn danger block" type="button" data-act="rmItem" data-id="${it.id}">Remove from ${isList?'list':'template'}</button></div></form>`);
  },
  priceGot(d){saveItemForm(d.id,true)},
  rmItem(d){const {it}=findItem(d.id);closeSheet();withUndo(`Removed ${it.name}`,()=>{const o=findItem(d.id);o.coll.splice(o.coll.indexOf(o.it),1)})},
  rmTplItem(d){ACT.rmItem(d)},
  clearCarry(){const t=T(view.id);withUndo('Cleared carried-over items',()=>{t.carry=[]})},
  newSheet(){sheet(`<h3>Create</h3><form data-form="create">
      <div class="seg"><label><input type="radio" name="kind" value="list" checked><b>Shopping list</b><small>Use it once, then finish</small></label>
      <label><input type="radio" name="kind" value="tpl"><b>Template</b><small>Reuse it every week</small></label></div>
      <div class="field"><label for="newName">Name</label><input id="newName" placeholder="e.g. Groceries, Hardware run" required></div>
      <div class="field"><label for="newItems">Items (optional)</label><textarea id="newItems" placeholder="Paste a list: one item per line or separated by commas&#10;2 kg rice&#10;Eggs 1 tray&#10;Cookies 5x"></textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px"><span class="flabel" id="newCount"></span>
        <label class="btn sm ghost" style="cursor:pointer">Load from text file<input type="file" id="newFile" accept=".txt,.csv,.md,.json,text/plain,application/json" hidden></label></div></div>
      <button class="btn primary block" type="submit">Create</button></form>
      <div class="sep"></div><button class="btn block" data-act="scanReceipt" style="margin-bottom:8px">${ICON.camera}Create from a receipt photo</button><label class="btn block" style="cursor:pointer">Import shared file<input type="file" id="impFile" accept=".json,application/json,text/plain" hidden></label>`)},
  listMenu(){const l=L(view.id);const t=l.templateId&&T(l.templateId);
    sheet(`<h3>List options</h3><form data-form="listMeta">
      <div class="field"><label for="mName">Name</label><input id="mName" value="${esc(l.name)}" required></div>
      <div class="field"><label for="mBudget">Budget (₱)</label><input id="mBudget" inputmode="decimal" value="${l.budget??''}" placeholder="Optional"></div>
      <button class="btn primary block" type="submit">Save</button></form>
      <div class="sep"></div><div class="actions">
      ${t?`<button class="btn block" data-act="updateTpl">Update “${esc(t.name)}” template to match this list</button>`:`<button class="btn block" data-act="saveAsTpl">Save as a template</button>`}
      <button class="btn block" data-act="scanReceipt">Scan a receipt to fill in prices</button>
      <button class="btn block" data-act="shareSheet" data-pre="${l.id}">Share this list</button>
      <button class="btn block" data-act="uncheckAll">Uncheck everything</button>
      <button class="btn danger block" data-act="delList">Delete list</button></div>`)},
  updateTpl(){const l=L(view.id);const t=T(l.templateId);closeSheet();
    withUndo(`Updated ${t.name} template`,()=>{t.items=l.items.map(i=>({id:uid(),name:i.name,qty:i.qty,cat:i.cat}))})},
  saveAsTpl(){const l=L(view.id);const t={id:uid(),name:l.name,autoDay:null,budget:l.budget||null,carry:[],items:l.items.map(i=>({id:uid(),name:i.name,qty:i.qty,cat:i.cat}))};
    state.templates.push(t);l.templateId=t.id;closeSheet();commit();toast('Saved as a template')},
  uncheckAll(){const l=L(view.id);closeSheet();withUndo('Unchecked everything',()=>l.items.forEach(i=>i.done=false))},
  tplMenu(){const t=T(view.id);
    sheet(`<h3>Template options</h3><form data-form="tplMeta">
      <div class="field"><label for="tName">Name</label><input id="tName" value="${esc(t.name)}" required></div>
      <div class="two"><div class="field"><label for="tDay">Start a new list every</label><select id="tDay"><option value="">Off (start manually)</option>${DAYS.map((d,i)=>`<option value="${i}" ${t.autoDay===i?'selected':''}>${d}</option>`).join('')}</select></div>
      <div class="field"><label for="tBudget">Weekly budget (₱)</label><input id="tBudget" inputmode="decimal" value="${t.budget??''}" placeholder="Optional"></div></div>
      <button class="btn primary block" type="submit">Save</button></form>
      <div class="sep"></div><div class="actions"><button class="btn block" data-act="scanReceipt">Add items from a receipt photo</button><button class="btn block" data-act="shareSheet" data-pre="${t.id}">Share this template</button><button class="btn danger block" data-act="delTpl">Delete template</button></div>`)},
  delTpl(){const t=T(view.id);closeSheet();withUndo(`Deleted ${t.name} template`,()=>{state.templates=state.templates.filter(x=>x.id!==t.id);view={s:'home'}})}
};
function saveItemForm(id,putInBasket){
  const {it}=findItem(id);if(!it)return;
  const name=$('#fName').value.trim();if(!name)return;
  if(name!==it.name&&$('#fCat').value===it.cat&&it.cat===guessCat(it.name))it.cat=guessCat(name);else it.cat=$('#fCat').value;
  it.name=name;it.qty=$('#fQty').value.trim();
  if($('#fPrice')){const p=num($('#fPrice').value);it.price=p;if(p)state.prices[name.toLowerCase()]=p}
  if(putInBasket)it.done=true;
  closeSheet();commit();
}
const FORM={
  add(){
    const inp=$('#addInput');const entries=parseEntries(inp.value);if(!entries.length)return;
    addToTpl=!!($('#addTpl')&&$('#addTpl').checked);
    addEntries(entries);inp.value='';$('#addInput')&&$('#addInput').focus();
  },
  bulk(){const entries=parseEntries($('#bulkTxt').value);if(!entries.length){toast('Type or paste at least one item');return}
    if($('#bulkTpl'))addToTpl=$('#bulkTpl').checked;closeSheet();addEntries(entries,true)},
  item(f){saveItemForm(f.dataset.id,false)},
  inv(f){invSave(f)},
  create(f){const name=$('#newName').value.trim();if(!name)return;const kind=f.querySelector('input[name=kind]:checked').value;
    const seen=new Set(),ents=parseEntries($('#newItems').value).filter(e=>{const k=e.name.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});closeSheet();
    if(kind==='tpl'){const t={id:uid(),name,autoDay:null,budget:null,carry:[],items:ents.map(e=>item(e.name,e.qty))};state.templates.push(t);view={s:'tpl',id:t.id}}
    else{const l={id:uid(),name,createdAt:Date.now(),status:'active',items:ents.map(e=>({...item(e.name,e.qty),done:false,price:null}))};state.lists.unshift(l);view={s:'list',id:l.id}}
    commit();scrollTo(0,0);if(ents.length)toast(`Added ${ents.length} item${ents.length>1?'s':''}`);else setTimeout(()=>$('#addInput')&&$('#addInput').focus(),50)},
  listMeta(){const l=L(view.id);l.name=$('#mName').value.trim()||l.name;l.budget=num($('#mBudget').value);closeSheet();commit()},
  tplMeta(){const t=T(view.id);t.name=$('#tName').value.trim()||t.name;const v=$('#tDay').value;t.autoDay=v===''?null:+v;t.budget=num($('#tBudget').value);
    if(t.autoDay!=null&&!t.lastStarted)t.lastStarted=Date.now();closeSheet();commit()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;e.preventDefault();const f=ACT[el.dataset.act];if(f)f(el.dataset,el)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const fn=FORM[f.dataset.form];if(fn)fn(f)});
document.addEventListener('change',e=>{if(e.target.id==='addTpl')addToTpl=e.target.checked;
  if((e.target.id==='scanCam'||e.target.id==='scanPick')&&e.target.files[0]){runScan(e.target.files[0]);return}
  if(e.target.dataset&&e.target.dataset.scan&&!['name','price','listname'].includes(e.target.dataset.scan)){scanEdit(e.target);return}
  if(e.target.id==='bulkFile'&&e.target.files[0]){e.target.files[0].text().then(txt=>{const ta=$('#bulkTxt');if(!ta)return;ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+txt.trim();bulkPreview()}).catch(()=>toast('Couldn’t read that file'))}
  if(e.target.id==='impFile'&&e.target.files[0]){e.target.files[0].text().then(txt=>{const p=parseShare(txt);if(p)openImport(p);else toast('That isn’t a Weekly Basket file. For a plain list, paste it into Items.')}).catch(()=>toast('Couldn’t read that file'))}
  if(e.target.id==='newFile'&&e.target.files[0]){const file=e.target.files[0];file.text().then(txt=>{const sp=parseShare(txt);if(sp){openImport(sp);return}const ta=$('#newItems');if(!ta)return;
    ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+txt.trim();ta.dispatchEvent(new Event('input',{bubbles:true}));
    const nm=$('#newName');if(nm&&!nm.value.trim())nm.value=cap(file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim())}).catch(()=>toast('Couldn’t read that file'))}});
document.addEventListener('input',e=>{if(e.target.id==='invQ'){view.q=e.target.value;const all=(state.catalog||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));$('#invList').innerHTML=invRows(all,view.q.toLowerCase());return}if(e.target.dataset&&['name','price','listname'].includes(e.target.dataset.scan))scanEdit(e.target);if(e.target.id==='bulkTxt')bulkPreview();if(e.target.id==='newItems'){const n=new Set(parseEntries(e.target.value).map(x=>x.name.toLowerCase())).size;$('#newCount').textContent=n?`${n} item${n>1?'s':''} found`:''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('paste',e=>{if(e.target.id!=='addInput')return;const t=(e.clipboardData||{}).getData?e.clipboardData.getData('text'):'';
  if(t&&/[\n,;]/.test(t)){e.preventDefault();e.target.value=t;FORM.add()}});

/* ---------- boot ---------- */
state=loadLocal()||sample();
state.prices=state.prices||{};
render();runAuto();voiceInit();
async function pull(){
  if(!ref||saveTimer)return;
  try{const snap=await ref.get();if(snap.exists){const r=snap.data().state;if(r&&(r.updatedAt||0)>(state.updatedAt||0)){state=JSON.parse(JSON.stringify(r));state.prices=state.prices||{};saveLocal();render();runAuto()}}
    else if(!state.example)scheduleCloud();
    cloud=true;paintSync()}catch(e){}
}
const MY_LIST=['Yoghurt','Joaquin juice','Strawberry milk','Small strawberry milk','Pororo juice','Cheese Whiz','Suka','White sugar','Tabasco','Honey',
  'Tuna','Corned beef','Luncheon meat','Likas or Belo Pink','Dove conditioner peptide','Lucky Me Sweet','Cup noodles','Lucky Me Macaroni',
  'Cheesecake','Wafer','Cookies 5x','Sumo cookies','Piyaya ube'];
function basicItems(){return SEED_CATALOG.map(([code,name,cat,unit,qty])=>({id:uid(),name,qty,cat}))}
function seed(){
  let changed=false;
  if(!state.seededList1&&!NATIVE){  /* your handwritten list, Claude version only (kept from before) */
    const tpl={id:uid(),name:'Weekly groceries',autoDay:null,budget:null,carry:[],items:parseEntries(MY_LIST.join('\n')).map(e=>item(e.name,e.qty))};
    if(state.example)state={templates:[],lists:[],prices:state.prices||{}};
    state.templates.unshift(tpl);state.seededList1=true;changed=true;
  }
  if((state.catalogV||0)<SEED_CATALOG_V){
    if(state.example)state={templates:[],lists:[],prices:{}};
    mergeSeedCatalog();
    for(const [code,name,cat,unit] of SEED_CATALOG)if(!state.prices[name.toLowerCase()]&&!/per kg/.test(name))state.prices[name.toLowerCase()]=unit;
    const basic=state.templates.find(t=>/^basic$/i.test(t.name.trim()));
    if(!basic){state.templates.unshift({id:uid(),name:'Basic',autoDay:null,budget:null,carry:[],items:basicItems()});changed=true}
    else{ /* your existing Basic: rename garbled scanned names to inventory names, add the rest */
      let ren=0,add=0;const have=new Set();const prevItems=JSON.stringify(basic.items),bid=basic.id;
      for(const it of basic.items){const e=invFind(it.name,null,it.qty);if(e&&!have.has(e.id)){if(it.name!==e.name){it.name=e.name;ren++}it.cat=e.cat;have.add(e.id)}}
      for(const [code,name,cat,unit,qty] of SEED_CATALOG){if(basic.items.some(i=>i.name.toLowerCase()===name.toLowerCase()))continue;basic.items.push({id:uid(),name,qty,cat});add++}
      if(ren||add){state.catalogV=SEED_CATALOG_V;commit();
        toast(`Basic template updated: ${ren} renamed, ${add} added`,()=>{const t=T(bid);if(t){t.items=JSON.parse(prevItems);commit()}});return}
    }
    changed=true;
  }
  if(changed)commit();
}
(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  const id=user&&await user.id();if(!db||!id)return;
  ref=db.doc('data/users/'+id+'/state');await pull();
}catch(e){}finally{seed()}})();
(async()=>{try{if(window.claude&&window.claude.use){dl=await window.claude.use('downloads');if(dl&&view.s==='report')render()}}catch(e){}})();
if(NATIVE){try{const A=NP('App');if(A)A.addListener('backButton',()=>{
  if($('#sheet'))closeSheet();else if(view.s==='report'&&L(view.id)&&L(view.id).status!=='done')ACT.open({id:view.id});
  else if(view.s!=='home')ACT.home();else A.exitApp()})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
})();
</script>
