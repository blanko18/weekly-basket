name: Build Weekly Basket APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish the APK as a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets (see README.md, step 2)."
            exit 1
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run www

      - name: Test receipt reader (offline OCR)
        run: npm run test:ocr

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          add = ''
          if 'RECORD_AUDIO' not in s:
              add += '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if 'android.speech.RecognitionService' not in s:
              add += ('    <queries>\n'
                      '        <intent><action android:name="android.speech.RecognitionService" /></intent>\n'
                      '        <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH" /></intent>\n'
                      '        <intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent>\n'
                      '    </queries>\n')
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w').write(s)
          print(s)
          PY
          npx cap sync android

      - name: Set version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]+\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias weeklybasket --out WeeklyBasket.apk aligned.apk
          "$BT/apksigner" verify --print-certs WeeklyBasket.apk | head -3
          rm -f release.jks

      - name: Check APK contents
        run: |
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('WeeklyBasket.apk'); n = set(z.namelist())
          need = ['assets/public/index.html', 'assets/public/vendor/tesseract/worker.min.js',
                  'assets/public/vendor/tesseract/tesseract.min.js', 'assets/public/vendor/tesseract/lang/eng.traineddata']
          missing = [f for f in need if f not in n]
          cores = [f for f in n if f.startswith('assets/public/vendor/tesseract/core/') and f.endswith('lstm.wasm.js')]
          plugins = z.read('assets/capacitor.plugins.json').decode()
          if missing or not cores or 'speech-recognition' not in plugins:
              raise SystemExit(f'APK is missing files: {missing} cores={cores} speech={"speech-recognition" in plugins}')
          print('APK contents OK:', len(cores), 'OCR cores, speech plugin registered')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: WeeklyBasket-apk
          path: WeeklyBasket.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Weekly Basket 1.0.${{ github.run_number }}
          files: WeeklyBasket.apk
          make_latest: true
          body: |
            Download **WeeklyBasket.apk** below and open it on your Android phone.
            If asked, allow your browser or file app to "install unknown apps".
